    <style>
        :root {
            --bg-color: #ffffff; 
            --banner-color: #a9c5e8;
            --accent-btn: #fab1e7;
            --text-color: #000000;
            --section-bg: rgba(255, 255, 255, 0.3);
        }

        body.dark-mode {
            --bg-color: #2c2c2c; 
            --banner-color: #496080;
            --accent-btn: #c452a6;
            --text-color: #ffffff;
            --section-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease; 
            margin: 0;
            padding: 20px;
        }

        .header, .createTask, .footer {
            background: var(--section-bg);
            border: 4px solid var(--text-color);
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header { background-color: var(--banner-color); }

        input {
            display: block;
            width: 90%;
            margin: 10px auto;
            font-family: 'Press Start 2P', cursive;
            padding: 10px;
            border: 3px solid var(--text-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 10px;
        }

        #submitTask, .mode-toggle {
            background-color: var(--accent-btn);
            font-family: 'Press Start 2P', cursive;
            padding: 10px;
            border: 3px solid var(--text-color);
            cursor: pointer;
            color: var(--text-color);
            margin-top: 10px;
        }

        .mode-toggle { position: fixed; top: 10px; right: 10px; font-size: 8px; }
        h1 { font-size: 18px; }
        h3 { font-size: 10px; }
    </style>
    <link rel="stylesheet" href="./style.css">
