<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Task Manager Dashboard</title>

    <link rel="stylesheet" href="./style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container">

    <script>
        alert("Welcome to Pixel Task Manager!");
    </script>

    <button class="mode-toggle"
        onclick="document.body.classList.toggle('dark-mode')">
        MODE
    </button>

    <div class="header">
        <h1>Pixel Task Manager</h1>
        <h3>Dashboard Overview</h3>
    </div>

    <div class="task-section">

        <h2>Upcoming Tasks</h2>

        <div id="upcoming"></div>

    </div>

    <div class="task-section">

        <h2>Task Statistics</h2>

        <p id="pendingCount">Pending: 0</p>

        <p id="completedCount">Completed: 0</p>

        <p id="overdueCount">Overdue: 0</p>

        <p id="totalCount">Total Tasks: 0</p>

    </div>

    <div class="task-section text-center">

        <a href="./tasks.html">
            <button class="status-btn">
                Add Task
            </button>
        </a>

    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="./app.js"></script>

</body>
</html>
